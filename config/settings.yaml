paths:
  raw_dir: data/raw
  understanding_dir: data/understanding
  regulatory_dir: data/raw/regulatory
  feedback_dir: data/understanding/feedback
  eval_dir: eval

llm:
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 1200

retrieval:
  top_k_regulatory: 5
  top_k_alerts: 10

screening:
  # Base thresholds — feedback loop may adjust multipliers
  cash_threshold_usd: 10000
  structuring_window_days: 7
  structuring_count: 3
  high_risk_countries:
    - IR
    - KP
    - SY
    - MM
    - YE
  correspondent_high_risk_flags:
    - nested_correspondent
    - payable_through
    - shell_bank_indicator

feedback:
  false_positive_score_penalty: 0.35
  true_hit_score_boost: 0.25
  min_score_floor: 0.05
  few_shot_memory_path: data/understanding/feedback/few_shot_memory.jsonl